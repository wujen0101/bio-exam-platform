<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>後中醫生物學測驗平台</title>
  <script>
    // GitHub Pages SPA 重導：把路徑存到 sessionStorage，再跳回根目錄
    var path = window.location.pathname.replace('/bio-exam-platform', '') || '/'
    var search = window.location.search
    var hash = window.location.hash
    sessionStorage.setItem('redirect', path + search + hash)
    window.location.replace('/bio-exam-platform/')
  </script>
</head>
<body></body>
</html>
